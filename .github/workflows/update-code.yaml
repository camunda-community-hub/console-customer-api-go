name: Update Code

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC: pick up upstream spec changes.
    - cron: "0 6 * * 1"

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Regenerate code
        run: make all

      - name: Status
        run: git status --short

      - name: Diff
        run: git diff

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: Update auto-generated client
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          branch: update-client
          delete-branch: true
          title: Update auto-generated client
          body: |
            The upstream OpenAPI spec has changed!

            This regenerates a new version of the client, based on the latest OpenAPI spec.
          assignees: |
            multani
            sijoma
          reviewers: |
            multani
            sijoma

      # Events from GITHUB_TOKEN don't start workflows, so the PR would get no CI.
      # workflow_dispatch is exempt, and its checks show on the PR's head commit.
      - name: Run tests on the update PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yaml --ref update-client
