name: Test

on:
  push:
    branches:
      - main
  # Fork PRs don't trigger push in this repo, so they need pull_request.
  pull_request:
  # The weekly update PR is opened with GITHUB_TOKEN, whose events don't start
  # workflows; update-code.yaml dispatches this workflow on its branch instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version:
          # Minimum from go.mod, plus the two supported Go releases.
          - "1.23"
          - oldstable
          - stable

    steps:
      - uses: actions/checkout@v7
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: make test

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # Re-apply the spec corrections to the committed upstream spec and regenerate
      # (no network fetch), then fail if the result differs from what is checked in.
      # --always-make: checkout mtimes are arbitrary, so never trust openapi.json as
      # up to date.
      - name: Re-apply spec corrections
        run: make --always-make openapi.json
      - name: Regenerate
        run: make clean generate
      - name: Check for drift
        run: |
          git diff --exit-code
          # git diff ignores untracked files, so also fail on files generation added.
          git status --porcelain
          test -z "$(git status --porcelain)"
