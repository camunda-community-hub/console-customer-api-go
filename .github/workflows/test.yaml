name: Test

on:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version:
          - "1.23"
          - "1.24"
          - "1.25"

    steps:
      - uses: actions/checkout@v6
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: make test

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # Regenerate from the committed openapi.json (no network fetch of the live
      # spec) and fail if the result differs from what is checked in.
      - name: Regenerate
        run: make clean generate
      - name: Check for drift
        run: git diff --exit-code
